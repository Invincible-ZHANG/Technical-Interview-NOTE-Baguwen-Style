# 临时 workflow：诊断并重触发 Pages 自定义域名证书签发
# 用后即删（连带 docs/_data/pages-status.json）
name: Pages HTTPS repair (temporary)

on:
  push:
    branches: ["main"]
    paths: ['.github/workflows/pages-https.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  repair:
    name: Diagnose & re-provision Pages HTTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call Pages API (GET -> PUT -> GET)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, datetime
          tok = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          base = f'https://api.github.com/repos/{repo}/pages'
          def api(method, data=None):
              cmd = ['curl', '-sS', '-w', '\n__HTTP__%{http_code}', '-X', method,
                     '-H', f'Authorization: Bearer {tok}',
                     '-H', 'Accept: application/vnd.github+json']
              if data is not None:
                  cmd += ['-d', json.dumps(data)]
              cmd.append(base)
              r = subprocess.run(cmd, capture_output=True, text=True)
              out = r.stdout
              body, _, code = out.rpartition('__HTTP__')
              try:
                  body = json.loads(body) if body.strip() else None
              except Exception:
                  body = body.strip()
              return {'http': code.strip(), 'body': body}

          status = {
              'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'before': api('GET'),
          }
          # 等价于网页上把 Custom domain 重新保存一次，触发证书重新 provisioning
          status['put'] = api('PUT', {'cname': 'www.zhangzijian.cn',
                                      'build_type': 'workflow'})
          time.sleep(10)
          status['after'] = api('GET')

          os.makedirs('docs/_data', exist_ok=True)
          with open('docs/_data/pages-status.json', 'w') as f:
              json.dump(status, f, indent=2, ensure_ascii=False)
          print(json.dumps(status, indent=2, ensure_ascii=False))
          PY

      - name: Commit status back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_data/pages-status.json
          git commit -m "chore(temp): record pages https status" || echo "nothing to commit"
          git push
