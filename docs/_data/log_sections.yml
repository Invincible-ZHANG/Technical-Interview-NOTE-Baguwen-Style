# ══════════════════════════════════════════════════════════
#  影像笔记的两个分区
#
#  key  == docs/log/ 下的子目录名，「影像笔记」总览页按这个顺序渲染。
#  想加第三个分区（比如「器材」）：建 docs/log/<key>/index.md，
#  在这个文件里追加一条，导航会自动带上。
# ══════════════════════════════════════════════════════════

- key: sensor
  title: Sensor 与成像
  en: From photon to pixel
  icon: "◐"
  url: /log/sensor/
  desc: >-
    工作里攒下的东西。光子怎么变成电荷、电荷怎么被读出来、
    ISP 在这之后又动了什么手脚，以及这些环节各自会在画面上留下什么痕迹。
  hint: 偏技术 · 适合想搞懂「为什么」的时候看

- key: aesthetic
  title: 摄影美学
  en: Learning to see
  icon: "◑"
  url: /log/aesthetic/
  desc: >-
    构图、光、色彩，以及同一个场景为什么别人拍出来比我有味道。
    以初学者的身份记，走弯路的过程也照写。
  hint: 偏审美 · 适合拍照前后随手翻
