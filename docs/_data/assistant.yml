# ══════════════════════════════════════════════════════════
#  小K —— 站内智能助手配置
#  改动这个文件即可调整助手的外观文案与默认模型，无需碰 JS
# ══════════════════════════════════════════════════════════

# 总开关：false 时全站不再注入助手（脚本与样式都不加载）
enabled: true

# ─── 身份 ───
name: 小K
tagline: 站内助理 · 摄影与成像
# 悬浮球上显示的字，1 个字最好看
mark: K

# ─── 开场白（支持 Markdown 换行）───
welcome: |
  我是小K，这个站里的随身助理。可以问成像技术、摄影构图，也可以让我在这堆笔记里找个说法。
  没把握的我不编，找不到的我会直说「站里没有」。

# ─── 首屏推荐问题（4 条以内最舒服）───
suggestions:
  - 手机夜景为什么总是「涂抹」？
  - 卷帘快门和果冻效应怎么解释？
  - 帮我找站里讲 RAW 的文章
  - 第一台相机该怎么选？

# ─── 默认模型 ───
# 可选：deepseek / moonshot / zhipu / dashscope / siliconflow / openai / custom
# 访客可以在设置里自己改，这里只是默认值
default_provider: deepseek
default_model: deepseek-chat

# ─── 代理地址（可选，推荐）───
# 静态站没有后端，Key 由访客自己填在浏览器里，直连服务商。
# 如果你想让访客「开箱即用」而不暴露 Key，可以自建一个转发（Cloudflare Worker 等），
# 把地址填在这里，例如 https://kk-proxy.your-name.workers.dev/chat
# 代理需要接收 { model, messages, stream } 并转发到服务商；填了之后浏览器不再直连。
proxy_url: ""

# ─── 站点级 Key（不建议填！）───
# 本站是公开仓库 + 静态页面，写在这里的 Key 会原样出现在 HTML 源码里，
# 等于公开发布。除非你只在本地预览，否则请留空。
api_key: ""

# ─── 行为开关 ───
# 是否允许助手检索站内文章（读 search.json，把命中的摘要发给模型做参考）
use_site_search: true
# 每次请求带上的历史条数（太大费 token，太小会失忆）
max_history: 12
# 采样温度：0 更稳，1 更活；技术问答建议 0.3 左右
temperature: 0.4
