# ══════════════════════════════════════════════════════════
#  照片清单 —— 摄影页和首页的照片都从这里取
#
#  加一张照片只要两步：
#    1. 把原图登记到 docs/_tools/make_photos.py 的 SOURCES 里，
#       跑一次 `python _tools/make_photos.py` 生成三种宽度
#    2. 在下面追加一条，slug 和 SOURCES 里的键保持一致
#
#  camera / settings 按你当时实际的器材和参数改，写不准就留空，
#  页面上会自动省略那一行。
# ══════════════════════════════════════════════════════════

- slug: cologne-dome-night
  title: 科隆，夜里十点
  date: 2025-11-08
  place: 科隆 · 德国
  series: 夜行
  camera: 手机 · 主摄
  settings: 24mm · f/1.8 · 1/15s · ISO 3200
  ratio: "4/3"
  featured: true
  tags: [夜景, 建筑, 手持]
  note: >
    从桥对岸拍过去，教堂被泛光灯打成暖金色，天空还留一点蓝。
    手持 1/15s，靠栏杆稳住，噪点明显但氛围对了。

