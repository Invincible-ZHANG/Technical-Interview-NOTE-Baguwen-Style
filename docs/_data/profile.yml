# ─── 关于我（每项一段，支持 Markdown 行内语法）───
about:
  - 工作是写摄像头驱动——每天和传感器、ISP、MIPI 打交道，盯着寄存器把一帧画面从光电转换一路送到屏幕上。这块还算熟。
  - 拍照是刚起的头，在北京，还在学。白天在代码里追一帧为什么暗、为什么会糊；晚上试着把它拍好看一点，废片率仍然很高。
  - 这个站用来放两样东西：拍下来的照片，以及拍完之后想明白的那点事。拍得不怎么样也照放，算是留个过程。
  - 本科在西安电子科技大学，硕士在 RWTH Aachen 读计算机工程，之后到北京工作。骑行、F1、健身都还在，只是相机还没买。

