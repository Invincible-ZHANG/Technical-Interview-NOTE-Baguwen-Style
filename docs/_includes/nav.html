<!-- _includes/nav.html  极简顶栏：左品牌 + 右链接 -->
{%- assign prof = site.data.profile -%}
<nav class="sticky-nav">
    <div class="sticky-nav-inner">
        <a class="nav-brand" href="{{ '/' | relative_url }}">
            <span class="nav-brand-mark">{{ prof.handle | default: 'K1n' }}</span><span class="nav-brand-dot">.</span>
        </a>
        <div class="nav-links">
            {%- for item in site.data.navigation %}
            {%- if item.children %}
            <div class="nav-dropdown">
                <a class="sticky-nav-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
                <div class="dropdown-menu">
                    {%- for sub in item.children %}
                    <a class="dropdown-link" href="{{ sub.url | relative_url }}">{{ sub.title }}</a>
                    {%- endfor %}
                </div>
            </div>
            {%- else %}
            <a class="sticky-nav-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
            {%- endif %}
            {%- endfor %}
        </div>
    </div>
</nav>
