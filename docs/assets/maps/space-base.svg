<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="航天基地区域示意图">
  <defs>
    <style>
      .bg      { fill: #14120f; }
      .border  { fill: none; stroke: rgba(255,212,121,0.24); stroke-width: 3; stroke-dasharray: 10 8; }
      .zone    { fill: rgba(255,212,121,0.05); stroke: rgba(255,212,121,0.2); stroke-width: 1.5; }
      .room    { fill: rgba(255,251,231,0.055); stroke: rgba(255,251,231,0.24); stroke-width: 1.2; }
      .room-hi { fill: rgba(255,212,121,0.14); stroke: rgba(255,212,121,0.5); stroke-width: 1.8; }
      .water   { fill: rgba(86,186,200,0.14); stroke: rgba(96,200,215,0.4); stroke-width: 1.5; }
      .land    { fill: #191714; stroke: none; }
      .bridge  { fill: rgba(255,212,121,0.16); stroke: rgba(255,212,121,0.46); stroke-width: 1.2; }
      .tunnel  { fill: none; stroke: rgba(255,212,121,0.3); stroke-width: 2; stroke-dasharray: 7 7; }
      .zipline { fill: none; stroke: rgba(255,251,231,0.3); stroke-width: 1.6; stroke-dasharray: 4 4; }
      .zname   { fill: rgba(255,251,231,0.46); font: 600 23px "PingFang SC","Microsoft YaHei",sans-serif; letter-spacing: 3px; }
      .num     { fill: rgba(255,212,121,0.62); font: 600 18px "PingFang SC","Microsoft YaHei",sans-serif; }
      .tiny    { fill: rgba(255,251,231,0.3); font: 400 16px "PingFang SC","Microsoft YaHei",sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900"/>
  <rect class="border" x="50" y="50" width="1100" height="830" rx="26"/>

  <!-- ══════ 外围·上半区 ══════ -->
  <rect class="zone" x="70" y="90" width="190" height="195" rx="10"/>
  <text class="zname" x="88" y="126">宿舍区</text>
  <text class="num"   x="88" y="268">21 点</text>

  <rect class="zone" x="300" y="70" width="170" height="205" rx="10"/>
  <text class="zname" x="318" y="106">中控楼</text>
  <text class="num"   x="318" y="258">29 点</text>
  <text class="tiny"  x="318" y="234">二楼 平台 · 保险柜</text>

  <rect class="zone" x="520" y="90" width="610" height="245" rx="10"/>
  <text class="zname" x="538" y="126">工业区</text>
  <text class="num"   x="1048" y="318">26 点</text>
  <rect class="room" x="545" y="140" width="155" height="75" rx="6"/>
  <rect class="room" x="760" y="140" width="170" height="75" rx="6"/>
  <rect class="room" x="545" y="245" width="155" height="65" rx="6"/>
  <text class="tiny"  x="770" y="272">南侧 · 露天罐装区</text>

  <!-- ══════ 核心区：水渠环绕 ══════ -->
  <rect class="water" x="300" y="360" width="580" height="380" rx="14"/>
  <rect class="land"  x="330" y="390" width="520" height="320" rx="8"/>

  <rect class="room" x="350" y="470" width="140" height="140" rx="6"/>
  <rect class="room" x="510" y="400" width="140" height="120" rx="6"/>
  <rect class="room" x="690" y="480" width="120" height="110" rx="6"/>
  <rect class="room" x="510" y="630" width="150" height="70" rx="6"/>
  <rect class="room-hi" x="555" y="545" width="120" height="70" rx="6"/>

  <path class="zipline" d="M580,520 L600,545"/>
  <path class="zipline" d="M585,630 L600,615"/>

  <text class="zname" x="896" y="470">核心区</text>
  <text class="num"   x="896" y="500">92 点</text>
  <text class="tiny"  x="896" y="526">水渠环绕 · 电磁干扰</text>
  <text class="tiny"  x="896" y="550">无小地图定位</text>

  <!-- ══════ 通道 ══════ -->
  <rect class="bridge" x="372" y="275" width="26" height="86" rx="4"/>
  <text class="tiny" x="404" y="300">中控桥</text>

  <path d="M560,336 L726,368" stroke="rgba(255,212,121,0.16)" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M560,336 L726,368" stroke="rgba(255,212,121,0.46)" stroke-width="1.3" fill="none"/>

  <path class="tunnel" d="M600,300 L542,278 L472,252"/>

  <rect class="bridge" x="302" y="430" width="26" height="60" rx="4"/>

  <!-- ══════ 外围·下半区 ══════ -->
  <rect class="zone" x="250" y="780" width="330" height="90" rx="10"/>
  <text class="zname" x="268" y="816">发射区</text>
  <text class="tiny"  x="268" y="852">飞升任务</text>

  <rect class="zone" x="700" y="780" width="300" height="90" rx="10"/>
  <text class="zname" x="718" y="816">水平试车间</text>
  <text class="tiny"  x="718" y="852">丢包撤离</text>
</svg>
